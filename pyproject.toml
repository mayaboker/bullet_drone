[project]
name = "bullet-drone"
version = "0.1.0"
description = "A PyBullet-based quadcopter simulation package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
    "pybullet>=3.2.7",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
bullet-drone = "bullet_drone.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
