[project]
name = "bullet-drone"
version = "0.2.0"
description = "A PyBullet-based quadcopter simulation package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
    "pybullet>=3.2.7",
    "pyyaml>=6.0.3",
    "bullet-simulation-protocol",
]

[project.scripts]
launcher = "launcher.main:main"

[project.optional-dependencies]
render = ["bullet-image-transport"]
sitl = []
mavlink = ["pymavlink>=2.4,<3"]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bullet_drone", "launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
bullet-simulation-protocol = { workspace = true }
bullet-image-transport = { workspace = true }

[tool.uv.workspace]
members = ["libs/*"]
